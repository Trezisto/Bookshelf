name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: home-library-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html

  # Shrunk (R8) release build. Signed when the ANDROID_KEYSTORE_BASE64 secret and its passwords are set,
  # otherwise unsigned; either way it proves the release configuration builds.
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BOOKSHELF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building an unsigned release"
          fi
      - run: ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
        env:
          BOOKSHELF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BOOKSHELF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BOOKSHELF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with:
          name: home-library-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
