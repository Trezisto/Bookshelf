spring.application.name=LibraryApp

# SQLite: a single file; WAL journal and foreign keys are enabled per connection
spring.datasource.url=jdbc:sqlite:${LIBRARY_DB_PATH:./data/library.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer at a time
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Defaults used when the app sends an API key without a base URL / model (Groq free tier)
library.llm.default-base-url=https://api.groq.com/openai/v1
library.llm.default-model=llama-3.1-8b-instant
library.llm.timeout=30s
spring.jackson.default-property-inclusion=always
