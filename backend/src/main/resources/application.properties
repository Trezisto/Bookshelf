spring.application.name=LibraryApp

# Every /api request needs "Authorization: Bearer <token>". Startup fails without a token,
# unless LIBRARY_ALLOW_ANONYMOUS=true (local development only).
library.api-token=${LIBRARY_API_TOKEN:}
library.allow-anonymous=${LIBRARY_ALLOW_ANONYMOUS:false}

# SQLite: a single file; WAL journal and foreign keys are enabled per connection
spring.datasource.url=jdbc:sqlite:${LIBRARY_DB_PATH:./data/library.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer at a time
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Defaults used when the app sends an API key without a base URL / model (Groq free tier)
library.llm.default-base-url=https://api.groq.com/openai/v1
library.llm.default-model=llama-3.1-8b-instant
library.llm.timeout=30s
# The only LLM endpoints the server will call (the app picks one; the default above is always allowed).
# Add a custom OpenAI-compatible endpoint here, e.g. via LIBRARY_LLM_ALLOWED_BASE_URLS.
library.llm.allowed-base-urls=https://api.groq.com/openai/v1,https://openrouter.ai/api/v1,\
  https://generativelanguage.googleapis.com/v1beta/openai,https://api.openai.com/v1
spring.jackson.default-property-inclusion=always

# Book lookup (Open Library + Google Books + a web search for the Goodreads link); all optional
# library.lookup.google-books-key=<Google API key, avoids the small shared anonymous quota>
library.lookup.connect-timeout=3s
library.lookup.read-timeout=6s
